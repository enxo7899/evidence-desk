[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-desk"
version = "0.0.1"
description = "Document Q&A service with hybrid retrieval, cited answers, a tool-calling agent and an evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Enxo Mucaj" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["evidence_desk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
